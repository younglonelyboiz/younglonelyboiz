<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" preserveAspectRatio="none" width="100%" height="160">
  <defs>
    <!-- Deep Ocean Gradient -->
    <linearGradient id="oceanDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95" />
    </linearGradient>

    <!-- Mid Wave Gradient -->
    <linearGradient id="oceanMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Front Wave Gradient -->
    <linearGradient id="oceanFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95" />
    </linearGradient>

    <!-- Sailboat Template -->
    <g id="sailboat">
      <!-- Hull -->
      <path d="M 0,0 L 50,0 L 40,16 L 8,16 Z" fill="#0f172a" />
      <!-- Hull Accent Stripe -->
      <path d="M 5,4 L 45,4 L 42,7 L 7,7 Z" fill="#38bdf8" />
      <!-- Mast -->
      <line x1="24" y1="0" x2="24" y2="-42" stroke="#475569" stroke-width="2" />
      <!-- Main Sail (White) -->
      <path d="M 26,-5 L 26,-38 L 48,-5 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <!-- Front Sail (Cyan Accent) -->
      <path d="M 22,-5 L 22,-32 L 6,-5 Z" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1" />
      <!-- Little Pennant Flag -->
      <path d="M 24,-42 L 32,-39 L 24,-36 Z" fill="#0284c7" />
    </g>

    <!-- Leaping Fish Template -->
    <g id="fish">
      <!-- Fish Body -->
      <path d="M -16,0 C -10,-8 6,-7 14,0 C 6,7 -10,8 -16,0 Z" fill="#0284c7" />
      <!-- Tail Fin -->
      <path d="M -14,0 L -24,-7 L -20,0 L -24,7 Z" fill="#38bdf8" />
      <!-- Dorsal Fin -->
      <path d="M -2,-5 Q 4,-12 8,-4 Z" fill="#38bdf8" />
      <!-- Eye -->
      <circle cx="8" cy="-2" r="1.5" fill="#ffffff" />
      <circle cx="9" cy="-2" r="0.7" fill="#0f172a" />
    </g>

    <!-- Splash Droplet Template -->
    <g id="splash">
      <circle cx="-6" cy="-2" r="2" fill="#ffffff" opacity="0.8" />
      <circle cx="0" cy="-6" r="2.5" fill="#bae6fd" opacity="0.9" />
      <circle cx="6" cy="-2" r="2" fill="#ffffff" opacity="0.8" />
    </g>

    <style>
      /* Faster & Lively Wave Drift Animations */
      @keyframes waveFast1 {
        0% { transform: translateX(0); }
        50% { transform: translateX(-20%); }
        100% { transform: translateX(0); }
      }
