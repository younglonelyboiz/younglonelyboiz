<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" preserveAspectRatio="none" width="100%" height="150">
  <defs>
    <linearGradient id="deep" x1="0%" y1="0%" x2="0%" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="mid" x1="0%" y1="0%" x2="0%" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="front" x1="0%" y1="0%" x2="0%" y2="1"><stop offset="0%" stop-color="#7dd3fc"/><stop offset="60%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <g id="boat">
      <path d="M0,0 L44,0 L36,14 L8,14 Z" fill="#0f172a"/><path d="M5,3 L40,3 L37,6 L7,6 Z" fill="#38bdf8"/>
      <line x1="22" y1="0" x2="22" y2="-36" stroke="#475569" stroke-width="2"/>
      <path d="M24,-4 L24,-32 L42,-4 Z" fill="#ffffff"/><path d="M20,-4 L20,-26 L6,-4 Z" fill="#e0f2fe"/>
      <path d="M22,-36 L29,-33 L22,-30 Z" fill="#0284c7"/>
    </g>
    <g id="fish">
      <path d="M-14,0 C-9,-7 5,-6 12,0 C5,6 -9,7 -14,0 Z" fill="#0284c7"/>
      <path d="M-12,0 L-20,-6 L-17,0 L-20,6 Z" fill="#38bdf8"/><path d="M-2,-4 Q3,-10 7,-3 Z" fill="#38bdf8"/>
      <circle cx="7" cy="-2" r="1.5" fill="#ffffff"/><circle cx="8" cy="-2" r="0.7" fill="#0f172a"/>
    </g>
    <style>
      @keyframes w1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-20%,6px); } }
      @keyframes w2 { 0%,100% { transform: translate(-15%,0); } 50% { transform: translate(6%,7px); } }
      @keyframes w3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-10%,5px); } }
      @keyframes bRock { 0%,100% { transform: translate(160px,75px) rotate(-6deg); } 50% { transform: translate(195px,84px) rotate(5deg); } }
      @keyframes fJump1 { 0%,35% { transform: translate(450px,130px) scale(0); opacity:0; } 42% { transform: translate(480px,70px) scale(1); opacity:1; } 50% { transform: translate(530px,35px) scale(1.1); opacity:1; } 58% { transform: translate(580px,80px) scale(1); opacity:1; } 63%,100% { transform: translate(600px,130px) scale(0); opacity:0; } }
      @keyframes fJump2 { 0%,55% { transform: translate(820px,135px) scale(0); opacity:0; } 62% { transform: translate(850px,75px) scale(1); opacity:1; } 70% { transform: translate(900px,40px) scale(1); opacity:1; } 78% { transform: translate(950px,85px) scale(1); opacity:1; } 83%,100% { transform: translate(970px,135px) scale(0); opacity:0; } }
      .layer1 { animation: w1 5s ease-in-out infinite; }
      .layer2 { animation: w2 4s ease-in-out infinite; }
      .layer3 { animation: w3 3s ease-in-out infinite; }
      .boat-anim { animation: bRock 5s ease-in-out infinite; }
      .fish-anim1 { animation: fJump1 5s ease-in-out infinite; }
      .fish-anim2 { animation: fJump2 6s ease-in-out infinite; }
    </style>
  </defs>
  <g class="layer1"><path fill="url(#deep)" d="M0,70 C150,95 350,45 500,70 C650,95 850,45 1000,70 C1150,95 1350,45 1500,70 L1500,180 L0,180 Z"/></g>
  <g class="boat-anim"><use href="#boat"/></g>
  <g class="layer2"><path fill="url(#mid)" d="M-100,85 C80,55 250,105 420,80 C600,50 780,105 950,80 C1120,55 1300,105 1450,80 L1450,180 L-100,180 Z"/></g>
  <g class="fish-anim1"><use href="#fish"/></g>
  <g class="fish-anim2"><use href="#fish"/></g>
  <g class="layer3">
    <path fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.9" d="M0,105 C120,80 240,125 380,100 C520,75 660,125 800,100 C940,75 1080,125 1220,100 C1360,75 1500,125 1640,100"/>
    <path fill="url(#front)" d="M0,105 C120,80 240,125 380,100 C520,75 660,125 800,100 C940,75 1080,125 1220,100 L1220,180 L0,180 Z"/>
  </g>
</svg>
